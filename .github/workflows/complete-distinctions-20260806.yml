name: Complete distinction answers once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/complete-distinctions-20260806.yml

permissions:
  contents: write

jobs:
  complete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Execute prepared rewrite
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          from textwrap import dedent

          workflow = Path('.github/workflows/bulk-rewrite-linux-memory.yml')
          text = workflow.read_text(encoding='utf-8')
          start = text.index("          python3 <<'PY'\n") + len("          python3 <<'PY'\n")
          end = text.index("\n          PY\n", start)
          code = dedent(text[start:end])
          exec(compile(code, str(workflow), 'exec'))
          Path('.github/workflows/complete-distinctions-20260806.yml').unlink()
          PY

      - name: Commit completed answers
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: complete Linux memory distinction answers"
          git push origin HEAD:main

# trigger
