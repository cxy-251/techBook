name: Complete Linux memory distinction answers

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bulk-rewrite-linux-memory.yml

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Complete direct answers
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          root = Path('docs/memory/linux-kernel')
          marker = '\n必须区分\n--------\n'
          next_marker = '\n一句话结论\n----------\n'

          sections = {
          '181-kernel-testing-boundary-and-failure-model.rst': '''* 返回错误码与失败后系统仍可信：正确错误码只说明当前调用报告了失败；系统可信还要求撤销发布、逆序释放资源、停止异步活动并恢复可再次使用的状态。
* 单元测试与用户态契约测试：单元测试验证局部内部逻辑和对象不变量；用户态契约测试验证系统调用、Ioctl、Netlink、文件接口等对外行为。
* 测试未复现与缺陷不存在：未复现只说明当前输入、配置和时序没有触发；只有覆盖了必要条件并验证不变量，才能支持缺陷不存在的结论。
* Coverage 与正确性断言：Coverage 证明代码被执行；断言才证明执行结果、状态和清理符合预期。
* ``SKIP`` 与 ``PASS``：``SKIP`` 表示前提不满足、测试没有执行目标行为；``PASS`` 表示目标行为已经执行并满足断言。
* Mock 环境结论与真实硬件结论：Mock 只能证明模型和软件边界下的行为；真实硬件还包含 Firmware、IRQ、DMA、缓存和时序约束。
* 同步函数被调用与异步活动真正收束：调用取消或同步接口只是动作；必须等待 Work、Timer、IRQ、RCU、DMA 等不再访问对象，Teardown 才完成。''',
          '182-kunit-for-in-kernel-unit-testing.rst': '''* ``KUNIT_EXPECT_*`` 与 ``KUNIT_ASSERT_*``：Expectation 记录失败后继续当前 Case；Assertion 在必要前置条件失败时立即终止当前 Case。
* 测试 Resource 生命周期与生产对象生命周期：KUnit Resource 管理 Fixture 和测试期资源；生产对象仍必须按真实注册、引用、异步收束和释放协议验证。
* UML 快速测试与真实硬件验证：UML 适合快速运行纯逻辑和错误路径；它不能代表真实架构、IRQ、DMA、Firmware 和设备时序。
* 内建执行器与 ``kunit.py`` 用户态工具：内建执行器在内核中发现并运行 Suite；``kunit.py`` 负责配置、构建、启动环境和解析 KTAP。
* KTAP ``ok`` 与没有任何内核运行时警告：``ok`` 只表示 Case 断言通过；KASAN、Lockdep、WARN、Oops 等日志仍会使整次运行失败。
* 内部逻辑正确与用户态接口契约正确：KUnit 能证明内部函数和对象行为；稳定 UAPI、权限和端到端交互仍需 kselftest 或系统测试。''',
          '183-kselftest-and-user-space-driven-kernel-tests.rst': '''* kselftest 与 KUnit：kselftest 从用户态入口验证内核对外合同；KUnit 在内核内部直接验证函数、结构体和局部状态机。
* 测试源码版本与当前运行内核版本：编译测试的源码版本决定测试期望；真正被验证的是当前启动内核，二者不匹配会产生假失败或假通过。
* 构建成功与行为验证成功：构建成功只证明测试程序和依赖可生成；运行断言通过才证明目标内核行为符合合同。
* ``SKIP`` 与 ``PASS``：``SKIP`` 表示功能、配置、权限或环境前提缺失；``PASS`` 表示目标路径已执行且断言成立。
* TAP/KTAP 测试结果与完整 Kernel Log 健康：协议结果描述测试项状态；Kernel Log 还可能包含测试框架未捕获的 Sanitizer、Lockdep、WARN 或 Oops。
* Root 环境通过与非特权安全合同正确：Root 通过只证明高权限路径；必须以普通 Credential、Namespace 和 Capability 再验证拒绝与授权边界。
* 用户态稳定行为与内核内部实现细节：返回值、Errno、事件和文件语义属于可测试合同；内部函数顺序和私有结构布局通常不应被测试固化。''',
          '184-fuzzing-syzkaller-and-bug-discovery.rst': '''* 随机输入与语义化状态探索：随机字节常停在浅层校验；语义化 Fuzzing 先构造有效资源和状态，再变异顺序、长度、并发和释放时机。
* Coverage 增长与发现 Bug：Coverage 增长只证明进入新路径；Sanitizer、WARN、Crash、Hang 或错误行为才是缺陷信号。
* Crash 标题与经过验证的根因：标题用于报告聚类；根因必须由首个失败证据、对象生命周期和可重复路径共同证明。
* ``repro.syz`` 与 C Reproducer：``repro.syz`` 保留 syzkaller 的资源、并发和执行器语义；C Reproducer 更便于独立编译阅读，但可能无法表达全部触发条件。
* 触发崩溃的最后调用与最初破坏对象的路径：最后调用只是暴露损坏的位置；真正根因可能发生在更早的分配、发布、并发访问或释放路径。
* 模拟设备覆盖与真实硬件覆盖：模拟环境验证协议模型和软件路径；真实硬件还包含 Firmware、总线、DMA、Reset 和物理时序。
* 报告消失与缺陷已正确修复：报告消失可能来自时序、配置或路径变化；修复必须恢复不变量，并由旧 Reproducer 和回归测试验证。''',
          '185-sanitizers-fault-injection-and-regression-prevention.rst': '''* KASAN 内存安全与 KCSAN 数据竞争：KASAN 检测越界和释放后访问；KCSAN 检测缺少同步的数据竞争。
* KASAN 高覆盖调试与 KFENCE 低开销采样：KASAN 通过广泛插桩提供高检测率但开销较大；KFENCE 以采样方式换取较低生产开销。
* Lockdep 依赖图告警与已经发生的真实死锁：Lockdep 发现可能形成循环的锁依赖；真实死锁还要求运行时任务实际进入互相等待状态。
* Refcount 保护对象存储与硬件仍在线：引用计数保证对象内存不被提前释放；它不保证设备、Firmware 或业务状态仍可用。
* RCU Grace Period 与取消所有异步活动：Grace Period 只等待既有 RCU Reader 离开；Work、Timer、IRQ、DMA 和普通引用必须分别收束。
* 故障注入的真实失败点与人为制造的不可能状态：有效注入模拟生产中允许发生的分配、I/O、Probe 或超时失败；不可能状态只会产生无意义结论。
* 报告消失与根因已修复：隐藏告警或改变时序也会让报告消失；只有对象、边界或同步不变量恢复才算修复。
* 修复后测试通过与测试确实能触发旧 Bug：新代码通过只说明当前结果；回归测试还必须在旧代码上稳定失败，证明它覆盖原故障。''',
          '186-understanding-the-linux-kernel-development-process.rst': '''* Mainline 与子系统维护者树：子系统树保存特定领域已评审、待集成的队列；Mainline 是跨子系统最终合入和发布的主线。
* 邮件列表 Review 与最终 Git 合入：Review 形成公开技术结论；只有提交出现在目标 Git Tree 中才表示真正合入。
* ``linux-next`` 集成与 Mainline 永久历史：``linux-next`` 提前测试多个下一周期树的组合；其中提交仍可能修改、撤回或未进入 Mainline。
* Merge Window 功能合入与 ``-rc`` 阶段修复：Merge Window 主要接收已准备好的功能和重构；``-rc`` 阶段主要收敛回归、崩溃和严重错误。
* Maintainer 责任与历史作者上下文：Maintainer 负责当前评审、排队和维护决策；历史作者只提供过往实现和问题背景。
* ``get_maintainer.pl`` 候选输出与最终收件人判断：脚本根据路径和历史生成候选；作者仍须结合影响范围和子系统规则决定 To/Cc。
* 补丁已经发送与补丁已经被接受：发送只表示进入公开讨论；维护者明确应用并进入目标树后才算接受。''',
          '187-preparing-patches-commit-messages-and-signed-off-by.rst': '''* 一个逻辑变更与一个文件：逻辑变更由同一问题和必要修复边界决定，可以跨多个文件；单个文件也可能包含多个应拆分的问题。
* Diff 与工程论证：Diff 说明代码如何变化；Commit Message 说明问题、根因、修复理由、影响和测试证据。
* Subject 与完整问题说明：Subject 只负责快速定位子系统、对象和动作；Body 必须保存可独立理解的因果链和边界。
* ``Signed-off-by`` DCO 声明与 ``Reviewed-by`` 技术认可：前者声明贡献权利和传递责任；后者表示 Reviewer 对特定版本技术内容的认可。
* ``Fixes:`` 引入问题的 Commit 与普通相关历史：``Fixes:`` 必须指向真正引入缺陷的提交；普通相关提交只能作为背景，不能替代 Culprit 判断。
* 永久 Commit Message 与 ``---`` 后的版本 Commentary：Commit Message 进入 Git 永久历史；``---`` 后内容服务当前邮件 Review，通常不随提交入树。
* Checkpatch 通过与补丁技术正确：Checkpatch 只检查格式、风格和部分常见模式；并发、生命周期、ABI 和硬件语义仍需人工 Review 与测试。''',
          '188-maintainers-mailing-lists-and-review-etiquette.rst': '''* ``MAINTAINERS`` 当前责任与 Git 历史作者：``MAINTAINERS`` 表示当前维护边界；历史作者只说明谁曾修改过代码，不自动拥有当前决策责任。
* ``get_maintainer.pl`` 候选与最终收件人：脚本输出路径和历史匹配候选；最终 To/Cc 必须按实际接口影响、子系统文档和 Review 责任筛选。
* ``git format-patch`` 生成邮件与 ``git send-email`` 投递：前者把 Commit 转换为纯文本 Patch；后者保持收件人和线程关系把 Patch 发往列表。
* Cover Letter 整体说明与单枚 Commit Message：Cover Letter 解释整个 Series 的目标、顺序和测试；每枚 Commit Message 仍必须自包含地解释自身逻辑变化。
* Inline Review 技术回应与无上下文 Top-post：Inline Reply 把答复绑定到具体评论和代码；Top-post 会切断问题与回答的对应关系。
* 新版自包含与保留旧版演进线索：v2/v3 必须独立可读；Changelog 和原线程同时保留相对上一版的变化原因。
* 邮件已经发送与邮件已经进入正确公开归档：客户端显示发送成功不证明列表收到；应以目标归档中的 Message-ID 和线程为准。''',
          '189-handling-review-feedback-revisions-and-regressions.rst': '''* Review 评论的表面措辞与背后的设计压力：评论文字可能很短；真正要回应的是 ABI、并发、错误路径、兼容性、测试或维护成本。
* 新版自包含与丢失版本演进历史：当前版本必须独立说明完整方案；Changelog 和邮件线程必须保留从旧版到新版的修改原因。
* Changelog 与最终 Commit Message：Changelog 记录本轮 Review 变化且不进入 Git 历史；Commit Message 保存最终问题和修复论证。
* Bisect Culprit 与经过验证的完整根因：Bisect 找到最早出现坏行为的提交；仍需分析该提交如何破坏对象或用户合同，才能确定根因。
* 普通 Bug 与破坏已有工作行为的 Regression：普通 Bug 可能长期存在；Regression 破坏此前可工作的行为，因此优先级和恢复责任更高。
* Revert 恢复基线与永久放弃功能：Revert 先恢复用户可用状态；功能可在重新设计和验证后再次提交。
* ``Closes:`` 关闭报告与 ``Link:`` 提供相关记录：``Closes:`` 表示该提交解决指定报告；``Link:`` 只建立相关讨论或证据链接。
* 跟踪工具状态与修复真正进入目标树：Tracker 的 resolved 状态是流程记录；必须检查目标 Mainline 或 Stable Branch 中的实际 Commit。''',
          '190-from-local-fix-to-upstream-contribution.rst': '''* Local Hack 恢复当前环境与 Upstreamable Fix 恢复通用不变量：Local Hack 可以依赖私有条件绕过症状；Upstreamable Fix 必须解释根因、适用范围、兼容性和长期维护成本。
* 本地症状消失与根因已修复：症状消失可能只是触发条件变化；根因修复必须恢复对象、状态机或同步不变量。
* 构建通过与运行和错误路径正确：构建只验证语法、类型和链接；运行测试还要验证正常路径、失败回滚和并发 Teardown。
* Mock/VM 覆盖与真实硬件覆盖：Mock/VM 适合验证逻辑和虚拟接口；真实硬件还包含 Firmware、IRQ、DMA、电源和总线时序。
* Mainline 修复与 Stable Backport：Mainline 修复面向当前上游代码；Stable Backport 要在旧版本依赖和对象模型上重新适配并验证。
* ``Cc: stable`` 候选提示与 Stable 已接受：Trailer 只通知 Stable Maintainer 评估；补丁出现在具体 Stable Branch 才表示接受。
* Patch 已发送与贡献已完成：发送只是 Review 开始；贡献还包括修改、测试、入树确认、回归响应和后续维护。
* 一次测试通过与长期维护责任结束：一次通过只覆盖当前环境；新接口和修复仍需持续接受其它配置、硬件和用户反馈。''',
          '191-preempt-rt-and-the-push-toward-deterministic-latency.rst': '''* 平均延迟与最坏情况延迟：平均值描述总体水平；实时系统是否满足 Deadline 由最大值和长尾上界决定。
* 实时调度优先级与 CPU 当前是否可被抢占：高优先级决定调度点上的选择；Hardirq、Raw Spinlock 和 Preempt-off 区间仍会阻止立即切换。
* Threaded IRQ 主体与 Hardirq Primary Handler：Primary Handler 在硬中断上下文完成最小确认并唤醒线程；Threaded Handler 在可调度线程中执行设备主体工作。
* ``spinlock_t`` 的 RT 语义与 ``raw_spinlock_t`` 的严格原子语义：PREEMPT_RT 下普通 ``spinlock_t`` 可映射为可睡眠并支持 PI 的锁；``raw_spinlock_t`` 始终保持不可睡眠的低级自旋语义。
* Priority Inheritance 与消除所有延迟来源：PI 缩短支持锁上的优先级反转；它不能解决 IRQ-off、Raw Lock、Firmware、设备或算法执行时间。
* CPU Isolation 与完全没有硬件和固件干扰：Isolation 减少调度、Tick、IRQ 和 RCU 干扰；NMI、SMI、Machine Check 和硬件事件仍可能出现。
* 一次 Benchmark 最大值与经过足够负载和时长验证的延迟上界：单次最大值只是样本；可用上界必须在目标硬件、长期压力和真实干扰下重复验证。''',
          '192-livepatching-and-updating-a-running-kernel.rst': '''* 函数入口可替换与系统语义一致：ftrace 可以重定向控制流；补丁作者仍须证明新旧函数对共享状态、锁、参数和返回合同兼容。
* 补丁模块已加载与补丁已对所有 Task 生效：加载只注册代码和元数据；每个 Task 到达安全点并完成 Transition 后才使用目标实现。
* Transition 完成与业务修复验证完成：Transition 完成只证明任务状态收敛；还需复现原问题并检查功能、数据和性能结果。
* 恢复旧函数入口与恢复旧共享状态：反向重定向可以恢复旧代码；补丁期间产生的不可逆数据或外部副作用不会自动回滚。
* Livepatch 紧急修复与完整内核升级：Livepatch 适合有限函数级紧急修复；完整升级包含所有代码、数据结构、初始化和安全更新，并通常需要重启。
* 源码补丁相同与不同 Kernel Build 可共用同一 Livepatch 二进制：源级修改可相同；二进制必须匹配具体 Build、Config、Compiler、符号和布局，不能跨构建复用。''',
          '193-rust-for-linux-and-memory-safe-kernel-components.rst': '''* Safe Rust 调用面与内部 ``unsafe`` 条件已经正确：Safe API 只表示调用者无需执行 Unsafe 操作；其安全仍依赖 Wrapper 正确维护全部底层前提。
* 所有权保护存储生命周期与硬件和业务状态仍有效：所有权防止对象内存被错误释放；设备在线、Firmware 状态和业务有效性仍需运行时协议保证。
* ``Pin`` 地址稳定与对象已经初始化和同步：``Pin`` 只保证对象不再移动；初始化完成、注册成功和异步收束必须由其它状态与 API 证明。
* Generated Binding 可调用与调用满足 C API 合同：Binding 只暴露 C 符号和类型；锁、指针、长度、Context 和生命周期前提仍由调用方保证。
* Rust 编译通过与 FFI、并发和设备行为正确：编译器验证类型系统能表达的约束；跨语言合同、同步和硬件协议仍需 Review 与运行测试。
* 减少部分内存安全错误与不再需要 Sanitizer 和故障测试：Rust 能提前阻止部分非法状态；``unsafe``、C 回调和设备边界仍需 KASAN、KCSAN、Lockdep 与 Fault Injection。
* Rust 作为选择性第二语言与重写整个 Linux 内核：Rust 用于边界清晰的新驱动和抽象；C 仍是主体，两种语言会长期通过受控接口共存。''',
          '194-confidential-computing-and-hardware-assisted-isolation.rst': '''* Memory Encryption 与 Attestation：内存加密限制宿主读取运行中私有页；Attestation 让远端验证平台、镜像和初始状态后再释放密钥。
* Private Memory 与 Shared Communication Buffer：Private Memory 受硬件保护且不应直接暴露给 Host；Shared Buffer 主动进入 Host/Device 可读写边界，内容必须校验。
* Host 无法读取 Guest 私有页与 Host 无法拒绝服务：机密计算保护机密性和部分完整性；Host 仍能暂停 vCPU、延迟 I/O 或撤销资源造成 DoS。
* IOMMU 地址隔离与 Host/Device 数据可信：IOMMU 限制 DMA 可达地址；它不证明设备响应、Descriptor、长度和完成状态可信。
* Secure Boot 与远程证明：Secure Boot 在本机启动时验证签名链；远程证明向外部 Owner 报告实际度量和 TCB 状态。
* Confidential VM 边界与 Guest 内部进程隔离：Confidential VM 保护整个 Guest 免受 Host 读取；Guest 内部仍依赖 Credential、LSM、Namespace 和应用权限隔离进程。
* 平台支持某技术与目标实例整条信任链已正确配置：硬件能力只是前提；Firmware、Kernel、VMM、证书、Attestation Service 和密钥策略都必须匹配。''',
          '195-future-directions-of-linux-kernel-engineering.rst': '''* 新功能数量增加与复杂度被约束：功能增加扩大能力和状态空间；真正的工程进步还要用类型、验证、测试和清晰接口压缩风险。
* 硬件容量扩大与访问延迟和同步成本下降：更多 CPU、内存和设备只增加资源规模；局部性、分片和更少共享协调才能降低单位访问与同步成本。
* eBPF 程序通过 Verifier 与业务逻辑正确：Verifier 证明程序满足当前安全和终止模型；它不证明策略、数据解释和性能目标正确。
* Rust 减少部分内存安全错误与所有内核风险消失：Rust 把部分所有权和边界错误移到编译期；FFI、``unsafe``、并发、硬件和业务错误仍存在。
* 更多观测接口与低开销、稳定和安全的观测：增加事件和 Hook 提高可见性；生产可用性还要求限制开销、ABI、权限和敏感信息泄漏。
* 自动化测试覆盖与维护者语义判断：自动化能扩大配置和输入覆盖；ABI、对象模型、长期兼容和设计取舍仍需维护者判断。
* 某项技术存在于源码树与它已适合所有生产环境：源码存在只证明能力正在实现；成熟度还取决于配置、架构、维护状态、测试和部署风险。
* 局部性能最优与系统级吞吐、尾延迟、功耗和安全最优：子系统局部指标改善可能把成本转移到其它路径；系统结论必须同时衡量端到端目标和副作用。'''
          }

          for name, body in sections.items():
              path = root / name
              text = path.read_text(encoding='utf-8')
              start = text.index(marker) + len(marker)
              end = text.index(next_marker, start)
              text = text[:start] + '\n' + body.rstrip() + '\n' + text[end:]
              path.write_text(text, encoding='utf-8')

          Path('.github/workflows/bulk-rewrite-linux-memory.yml').unlink()

          files = sorted(root.glob('[0-9][0-9][0-9]-*.rst'))
          if len(files) != 195:
              raise SystemExit(f'expected 195 chapters, found {len(files)}')
          for path in files:
              text = path.read_text(encoding='utf-8')
              if '\n来源\n----\n' in text:
                  raise SystemExit(f'source section remains: {path}')
              section = text[text.index(marker) + len(marker):text.index(next_marker)].strip()
              if not section:
                  raise SystemExit(f'empty distinction section: {path}')
              for line in [x for x in section.splitlines() if x.strip()]:
                  if not line.startswith('* ') or '：' not in line:
                      raise SystemExit(f'non-answer distinction: {path}: {line}')
                  answer = line.split('：', 1)[1].strip().rstrip('。')
                  if len(answer) < 8:
                      raise SystemExit(f'incomplete distinction: {path}: {line}')

          print(f'completed direct answers in {len(sections)} chapters')
