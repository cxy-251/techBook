name: Finalize Linux memory textbook once

on:
  schedule:
    - cron: '*/5 * * * *'
  create:

permissions:
  contents: write

jobs:
  finalize:
    if: github.event_name == 'schedule' || (github.event.ref_type == 'branch' && github.event.ref == 'linux-memory-normalize-trigger')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Restore and normalize chapters 001-180
        shell: bash
        run: |
          python3 <<'PY'
          from __future__ import annotations

          import re
          import subprocess
          from pathlib import Path

          BASE = '1bdbedbf1a1a8ec925c8675e18c4eb1ebadd2755'
          ROOT = Path('docs/memory/linux-kernel')
          MARKER = '\n必须区分\n--------\n'
          NEXT = '\n一句话结论\n----------\n'

          files = sorted(ROOT.glob('[0-9][0-9][0-9]-*.rst'))
          if len(files) != 195:
              raise SystemExit(f'expected 195 chapters, found {len(files)}')

          def extract(text: str) -> str:
              start = text.index(MARKER) + len(MARKER)
              end = text.index(NEXT, start)
              return text[start:end]

          def replace_section(text: str, section: str) -> str:
              start = text.index(MARKER) + len(MARKER)
              end = text.index(NEXT, start)
              return text[:start] + '\n' + section.strip() + '\n' + text[end:]

          def normalize_original(section: str) -> str:
              lines = section.strip('\n').splitlines()
              if any(line.startswith('* ') for line in lines):
                  items: list[str] = []
                  current: list[str] = []
                  for line in lines:
                      if line.startswith('* '):
                          if current:
                              items.append(' '.join(current).strip())
                          current = [line[2:].strip()]
                      elif current and line.strip():
                          current.append(line.strip())
                  if current:
                      items.append(' '.join(current).strip())
                  if not items:
                      raise ValueError('empty bullet distinction section')
                  return '\n'.join('* ' + item.rstrip('；。') + '。' for item in items)

              entries: list[tuple[str, str]] = []
              term: str | None = None
              answer: list[str] = []

              def flush() -> None:
                  nonlocal term, answer
                  if term is not None:
                      body = ' '.join(answer).strip()
                      if not body:
                          raise ValueError(f'distinction term has no answer: {term}')
                      entries.append((term.rstrip('：'), body.rstrip('；。')))
                  term = None
                  answer = []

              for line in lines:
                  if not line.strip():
                      continue
                  if line[:1].isspace():
                      if term is None:
                          raise ValueError(f'orphan distinction answer: {line}')
                      answer.append(line.strip())
                  else:
                      flush()
                      term = line.strip()
              flush()

              if not entries:
                  raise ValueError('empty definition-list distinction section')
              return '\n'.join(f'* {term}：{body}。' for term, body in entries)

          for path in files[:180]:
              original = subprocess.check_output(
                  ['git', 'show', f'{BASE}:{path.as_posix()}'],
                  text=True,
                  encoding='utf-8',
              )
              current = path.read_text(encoding='utf-8')
              current = replace_section(current, normalize_original(extract(original)))
              current = re.sub(r'\n来源\n----\n.*\Z', '\n', current, flags=re.S)
              path.write_text(current.rstrip() + '\n', encoding='utf-8')

          for path in files:
              text = path.read_text(encoding='utf-8')
              text = re.sub(r'\n来源\n----\n.*\Z', '\n', text, flags=re.S)
              path.write_text(text.rstrip() + '\n', encoding='utf-8')

          for temp in (
              '.github/workflows/finalize-linux-memory.yml',
              '.github/workflows/bulk-rewrite-linux-memory.yml',
              '.github/workflows/complete-distinctions-20260806.yml',
              'project/.linux-memory-normalization-trigger',
          ):
              Path(temp).unlink(missing_ok=True)

          for path in files[:180]:
              text = path.read_text(encoding='utf-8')
              section = extract(text).strip()
              if not section:
                  raise SystemExit(f'empty distinction section: {path}')
              lines = [line for line in section.splitlines() if line.strip()]
              if not all(line.startswith('* ') and '：' in line for line in lines):
                  raise SystemExit(f'incomplete direct-answer section: {path}')

          for path in files:
              if '\n来源\n----\n' in path.read_text(encoding='utf-8'):
                  raise SystemExit(f'source section remains: {path}')

          print('validated chapters 001-180 and removed all source sections')
          PY

      - name: Commit the finalized chapters
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: restore direct distinctions for chapters 001-180"
          git pull --rebase origin main
          git push origin HEAD:main
          git push origin --delete linux-memory-normalize-trigger || true
