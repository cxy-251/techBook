book_id = "linux-kernel"
plan_version = 1
status = "frozen"
title = "Linux Kernel 源码阅读：ARM64 启动、初始化与 VFS"
architecture = "arm64"
order_policy = "strict"
revision_policy = "explicit-plan-revision-only"
chapter_count = 17

part_files = [
  "manifests/books/linux-kernel-plan/01-boot.toml",
  "manifests/books/linux-kernel-plan/02-init.toml",
  "manifests/books/linux-kernel-plan/03-vfs.toml",
]

[target]
reader = "会 C 和基础操作系统概念，但尚未形成稳定内核源码阅读方法的读者"
outcome = "能够从可观察现象进入固定源码，提取最短调用路径，并使用启动日志、tracefs、ftrace 与用户态实验验证判断"

[scope]
include = [
  "ARM64 early boot and MMU transition",
  "start_kernel, rest_init and initcall",
  "kernel_init to userspace init",
  "ARM64 read syscall entry and VFS dispatch",
]
exclude = [
  "完整内核目录百科",
  "逐行翻译整个 start_kernel",
  "驱动和文件系统大全",
  "缺少实验支撑的架构散文",
]

[first]
chapter_id = "LK-BOOT-001"
question = "ARM64 Linux 内核镜像从哪个入口开始执行？"
