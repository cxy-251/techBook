boot_disk = "one boot disk attached to AHCI SATA port 0"
bootloader = "GNU GRUB 2.14 i386-pc"
grub_release = "2.14"
grub_repository = "GitMirroring/grub"
grub_commit = "d38d6a1a9b79427848976f53d474392cd29c2a71"
grub_official_archive = "https://ftp.gnu.org/gnu/grub/grub-2.14.tar.xz"
grub_disk_layout = "MBR disk; ext4 first partition at LBA 2048; /boot/grub; core.img embedded contiguously from LBA 1"
grub_config = "set timeout=0; set default=0; menuentry Linux 6.12.95 with linux /boot/bzImage-6.12.95 root=/dev/sda1 ro console=ttyS0 and initrd /boot/initramfs-6.12.95.img"
kernel_image = "bzImage"
kernel_path = "/boot/bzImage-6.12.95"
initramfs_path = "/boot/initramfs-6.12.95.img"
kernel_release = "6.12.95"
boot_protocol = "Linux/x86 Boot Protocol"

