[source]
architecture = "x86_64"
platform = "QEMU q35"
firmware = "SeaBIOS"
firmware_repository = "coreboot/seabios"
firmware_commit = "c2a33ad9ad1452e23b41c4ac44a3bc6be8ebc4cf"
