[project]
name = "techbook"
version = "0.1.0"
description = "Source-first technical books written in reStructuredText"
requires-python = ">=3.12"
dependencies = [
  "doc8>=1.1",
  "sphinx>=8",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.12",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["labs"]
python_files = ["test_*.py"]
